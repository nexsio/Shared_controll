[package]
name = "ble-poc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
protocol = { path = "../protocol" }
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "signal"] }
