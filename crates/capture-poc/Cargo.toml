[package]
name = "capture-poc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "input_capture"] }
reis = { version = "0.7", features = ["tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
